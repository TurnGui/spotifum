spring:
  application:
    name: spotifum-api

  datasource:
    url: jdbc:postgresql://localhost:5432/spotifum
    username: spotifum
    password: spotifum
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  secret: spotifum-secret-key-change-this-in-production-must-be-at-least-256-bits
  expiration: 86400000