spring:
  application:
    name: spotifum-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/spotifum}
    username: ${DATABASE_USERNAME:spotifum}
    password: ${DATABASE_PASSWORD:spotifum}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:spotifum-secret-key-change-this-in-production-must-be-at-least-256-bits}
  expiration: 86400000